<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#253549" stroke-width="1" stroke-opacity="0.4" />
    </pattern>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Accents -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseRoute {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(14px) translateX(-10px); }
    }
    @keyframes radarSweep {
      0% { r: 10px; opacity: 0.8; }
      100% { r: 85px; opacity: 0; }
    }
    @keyframes truckMove {
      0% { transform: translateX(0px); }
      50% { transform: translateX(80px); }
      100% { transform: translateX(0px); }
    }

    .pulse-line {
      stroke-dasharray: 12, 8;
      animation: pulseRoute 14s linear infinite;
    }
    .orb-1 {
      animation: floatOrb1 7s ease-in-out infinite;
    }
    .orb-2 {
      animation: floatOrb2 9s ease-in-out infinite;
    }
    .radar-pulse-1 {
      animation: radarSweep 3s cubic-bezier(0.1, 0.4, 0.6, 1) infinite;
    }
    .radar-pulse-2 {
      animation: radarSweep 3s cubic-bezier(0.1, 0.4, 0.6, 1) 1.5s infinite;
    }
    .carrier-node {
      transition: all 0.3s ease;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Animated Background Logistics Hub / Network Routes -->
  <g opacity="0.35">
    <!-- Logistics routes between nodes -->
    <path class="pulse-line" d="M 120 280 Q 280 180 500 240 T 880 160 T 1100 220" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="pulse-line" d="M 80 100 Q 320 60 560 140 T 960 90 T 1150 130" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="pulse-line" d="M 150 320 C 350 340, 750 300, 1050 310" fill="none" stroke="#0ea5e9" stroke-width="1.5" />

    <!-- Pulsing Radar Radar Centers -->
    <circle cx="980" cy="110" fill="none" stroke="#38bdf8" stroke-width="1.5" class="radar-pulse-1" />
    <circle cx="980" cy="110" fill="none" stroke="#818cf8" stroke-width="1.5" class="radar-pulse-2" />

    <circle cx="160" cy="260" fill="none" stroke="#a855f7" stroke-width="1.5" class="radar-pulse-1" />
  </g>

  <!-- Ambient Blurred Glow Elements (Under layer) -->
  <circle cx="200" cy="90" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="orb-1" />
  <circle cx="1020" cy="270" r="170" fill="#818cf8" opacity="0.14" filter="url(#glow)" class="orb-2" />

  <!-- Logistics Network Nodes in Background (Cards/Pills) -->
  <g opacity="0.75" class="orb-1">
    <rect x="910" y="45" width="140" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.8" />
    <text x="980" y="67" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Multi-Carrier</text>
  </g>
  <g opacity="0.75" class="orb-2">
    <rect x="970" y="275" width="150" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.8" />
    <text x="1045" y="297" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📦 Live Tracking</text>
  </g>
  <g opacity="0.65" class="orb-1">
    <rect x="70" y="40" width="150" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.8" />
    <text x="145" y="62" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🏷️ Automated Labels</text>
  </g>
  <g opacity="0.65" class="orb-2">
    <rect x="100" y="300" width="130" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.8" />
    <text x="165" y="322" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 Fleet & Freight</text>
  </g>

  <!-- Foreground Main Title and Headers (Guaranteed on Top) -->
  <g id="foreground-content">
    <!-- Top Category Badge -->
    <g transform="translate(600, 75)">
      <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="-150" cy="0" r="5" fill="#38bdf8" />
      <text x="5" y="5" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">
        CURATED LOGISTICS TECH ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
      Awesome Shipping &amp; Logistics
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="600" y="210" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2" text-anchor="middle">
      Multi-Carrier Shipping APIs • Automated Label Printing • Warehouse &amp; Fleet Management
    </text>

    <!-- Feature Pillars Row -->
    <g transform="translate(600, 260)">
      <!-- Pill 1 -->
      <g transform="translate(-250, 0)">
        <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
          🌐 10+ Leading SaaS
        </text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
          ⭐ Top Open-Source Engines
        </text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(250, 0)">
        <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
          📊 Verified Pricing &amp; Scale
        </text>
      </g>
    </g>
  </g>
</svg>